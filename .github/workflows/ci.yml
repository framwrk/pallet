name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, transfer and UI tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Transfer tests
        run: bun run test:transfers

      - name: Build Electron for UI regressions
        run: bun run rebuild && bun run build

      - name: Local Electron UI regressions
        run: bun run test:ui:local

      - name: UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-diagnostics
          path: .agents/artifacts/ui/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
