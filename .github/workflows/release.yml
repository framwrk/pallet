name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: macos-15
    steps:
      - name: Checkout the pushed tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate pushed tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ $TAG_NAME =~ $semver_re ]]; then
            echo "error: tag '$TAG_NAME' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"

          current=$(bun -e 'process.stdout.write(require("./package.json").version)')
          if [ "$current" != "$version" ]; then
            echo "error: package.json version is $current but tag is $TAG_NAME" >&2
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$TAG_NAME^{commit}")" ]; then
            echo "error: checkout is not at tag $TAG_NAME" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_NAME^{commit}" origin/main; then
            echo "error: tag $TAG_NAME is not reachable from origin/main" >&2
            exit 1
          fi

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Transfer tests
        run: bun run test:transfers

      - name: Rebuild native dependencies
        run: bun run rebuild

      - name: Build the DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run build:mac

      - name: Verify the release
        run: bash scripts/verify-release.sh "$RELEASE_TAG"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(
            release create "$RELEASE_TAG"
            "dist/pallet-${RELEASE_VERSION}.dmg"
            "dist/checksums.txt"
            --verify-tag
            --title "Pallet - $RELEASE_TAG"
            --generate-notes
          )
          if [ "${RELEASE_VERSION%%.*}" = "0" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
