name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z version already merged into main"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and draft the release
    runs-on: macos-15
    steps:
      - name: Checkout main
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout the pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --force origin main --tags
          if [ -n "$(git status --porcelain)" ]; then
            echo "error: the working tree is not clean" >&2
            exit 1
          fi
          git checkout -B main origin/main
          git branch --set-upstream-to=origin/main main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "error: HEAD does not match origin/main; merge the version bump pull request first" >&2
            exit 1
          fi

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ $VERSION_INPUT =~ $semver_re ]]; then
            echo "error: version must be X.Y.Z (got '$VERSION_INPUT')" >&2
            exit 1
          fi
          version="$VERSION_INPUT"

          current=$(bun -e 'process.stdout.write(require("./package.json").version)')
          if [ "$current" != "$version" ]; then
            echo "error: package.json version is $current, expected $version; merge the version bump pull request first" >&2
            exit 1
          fi

          tag="v$version"
          if ! remote_tag=$(git ls-remote --tags origin "refs/tags/$tag"); then
            echo "error: could not check origin for tag $tag" >&2
            exit 1
          fi
          if [ -n "$remote_tag" ]; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tag_commit=$(git rev-parse "$tag^{commit}")
            if [ "$tag_commit" != "$(git rev-parse origin/main)" ]; then
              echo "error: tag $tag already exists but does not point at origin/main" >&2
              exit 1
            fi
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_commit=$(git rev-parse "$tag^{commit}")
            if [ "$tag_commit" != "$(git rev-parse origin/main)" ]; then
              echo "error: local tag $tag already exists but does not point at origin/main" >&2
              exit 1
            fi
          fi

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Validate pushed tag
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ $TAG_NAME =~ $semver_re ]]; then
            echo "error: tag '$TAG_NAME' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"

          current=$(bun -e 'process.stdout.write(require("./package.json").version)')
          if [ "$current" != "$version" ]; then
            echo "error: package.json version is $current but tag is $TAG_NAME" >&2
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$TAG_NAME^{commit}")" ]; then
            echo "error: checkout is not at tag $TAG_NAME" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_NAME^{commit}" origin/main; then
            echo "error: tag $TAG_NAME is not reachable from origin/main" >&2
            exit 1
          fi

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Transfer tests
        run: bun run test:transfers

      - name: Rebuild native dependencies
        run: bun run rebuild

      - name: Build the DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run build:mac

      - name: Verify the release
        run: bash scripts/verify-release.sh "v$RELEASE_VERSION"

      - name: Create and push the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          git fetch --force origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "error: origin/main moved while the release was building; re-run from the new main" >&2
            exit 1
          fi

          if ! remote_tag=$(git ls-remote --tags origin "refs/tags/$tag"); then
            echo "error: could not check origin for tag $tag" >&2
            exit 1
          fi

          if [ -n "$remote_tag" ]; then
            tag_commit=$(git rev-parse "$tag^{commit}")
            if [ "$tag_commit" != "$(git rev-parse origin/main)" ]; then
              echo "error: tag $tag already exists but does not point at origin/main" >&2
              exit 1
            fi
          else
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              tag_commit=$(git rev-parse "$tag^{commit}")
              if [ "$tag_commit" != "$(git rev-parse origin/main)" ]; then
                echo "error: local tag $tag already exists but does not point at origin/main" >&2
                exit 1
              fi
            else
              git tag -a "$tag" -m "$tag"
            fi
            git push origin "refs/tags/$tag"
          fi

      - name: Check for an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "error: a release for $RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          version="$RELEASE_VERSION"
          args=(
            release create "$tag"
            "dist/pallet-${version}.dmg"
            "dist/checksums.txt"
            --verify-tag
            --draft
            --title "Pallet - $tag"
            --generate-notes
          )
          if [ "${version%%.*}" = "0" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
