[global]
  server role = standalone server
  workgroup = WORKGROUP
  map to guest = Never
  disable netbios = yes
  smb ports = 445
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  log level = 1

[pallet]
  path = /srv/pallet
  valid users = pallet
  read only = no
  force user = pallet
  create mask = 0644
  directory mask = 0755
