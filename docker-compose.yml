x-network-settings: &network-settings
  cap_add: [NET_ADMIN]
  # Uploads enter the IP stack through the shaper's virtual interface.
  sysctls:
    net.ipv4.conf.all.rp_filter: 0
    net.ipv4.conf.default.rp_filter: 0

x-network-environment: &network-environment
  PALLET_TEST_NETWORK: "${PALLET_TEST_NETWORK:-realistic}"
  PALLET_TEST_DOWNLOAD_KBIT: "${PALLET_TEST_DOWNLOAD_KBIT:-}"
  PALLET_TEST_UPLOAD_KBIT: "${PALLET_TEST_UPLOAD_KBIT:-}"
  PALLET_TEST_DELAY_MS: "${PALLET_TEST_DELAY_MS:-}"
  PALLET_TEST_JITTER_MS: "${PALLET_TEST_JITTER_MS:-}"
  PALLET_TEST_LOSS_PERCENT: "${PALLET_TEST_LOSS_PERCENT:-}"

services:
  sftp:
    <<: *network-settings
    build:
      context: ./test-server
    environment:
      <<: *network-environment
      PALLET_TEST_PASSWORD: "${PALLET_TEST_PASSWORD:-pallet}"
    ports:
      - "127.0.0.1:${PALLET_TEST_SERVER_PORT:-2222}:22"
    volumes:
      - test-server-host-keys:/etc/ssh/host-keys
    healthcheck:
      test: ["CMD", "pidof", "sshd"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  ftp:
    <<: *network-settings
    build:
      context: ./test-server
    environment:
      <<: *network-environment
      PALLET_TEST_PASSWORD: "${PALLET_TEST_PASSWORD:-pallet}"
      PALLET_TEST_PROTOCOL: ftp
    ports:
      - "127.0.0.1:${PALLET_TEST_FTP_PORT:-2121}:21"
      - "127.0.0.1:30000-30009:30000-30009"
    healthcheck:
      test: ["CMD", "pidof", "pure-ftpd"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  ftps:
    <<: *network-settings
    build:
      context: ./test-server
    environment:
      <<: *network-environment
      PALLET_TEST_PASSWORD: "${PALLET_TEST_PASSWORD:-pallet}"
      PALLET_TEST_PROTOCOL: ftps
    ports:
      - "127.0.0.1:${PALLET_TEST_FTPS_PORT:-2122}:21"
      - "127.0.0.1:30100-30109:30100-30109"
    volumes:
      - test-server-ftps-certificate:/etc/pure-ftpd/certs
    healthcheck:
      test: ["CMD", "pidof", "pure-ftpd"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  minio:
    profiles: ["s3"]
    image: cgr.dev/chainguard/minio@sha256:16b824a0016ffad3dfa8b059755f83800aa42ca68fe86f1782cabd0c5a16d322
    command: server /data
    environment:
      MINIO_ROOT_USER: "${PALLET_S3_TEST_ACCESS_KEY:-pallet}"
      MINIO_ROOT_PASSWORD: "${PALLET_S3_TEST_SECRET_KEY:-pallet-secret}"
    ports:
      - "127.0.0.1:${PALLET_S3_TEST_PORT:-19000}:9000"
    tmpfs:
      - /data

volumes:
  test-server-host-keys:
  test-server-ftps-certificate:
